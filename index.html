<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Fenstergucker</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;background:#111b21;display:flex;justify-content:center;align-items:center;min-height:100vh}
.app{width:100%;max-width:480px;height:100vh;max-height:920px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 0 60px rgba(0,0,0,.6)}
.header{background:#202c33;padding:8px 14px;display:flex;align-items:center;gap:10px;flex-shrink:0}
.gav{width:42px;height:42px;border-radius:50%;overflow:hidden;flex-shrink:0;background:#0d2233}
.hi{flex:1;min-width:0}
.hi h1{color:#e9edef;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hi p{color:#8696a0;font-size:12px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hicons{display:flex;gap:18px}
.hicons svg{fill:#aebac1;cursor:pointer}
.api-bar{background:#1a3a2a;border-bottom:1px solid #2a5a3a;padding:8px 14px;display:flex;flex-direction:column;gap:6px;flex-shrink:0}
.api-bar-top{display:flex;align-items:center;justify-content:space-between}
.api-bar-top span{color:#8696a0;font-size:12px}
.api-st{font-size:11px;padding:3px 8px;border-radius:4px}
.api-st.ok{background:#0d2a0d;color:#7bc67e}
.api-st.no{background:#2a2a0d;color:#fcbd2d}
.api-bar-bot{display:flex;gap:6px}
.api-iw{flex:1;background:#0b141a;border:1px solid #2a3942;border-radius:6px;padding:6px 10px;display:flex}
.api-iw input{flex:1;background:transparent;border:none;outline:none;color:#e9edef;font-size:12px;font-family:inherit;min-width:0}
.api-iw input::placeholder{color:#4a5a62}
.api-btn{background:#00a884;border:none;border-radius:6px;color:#fff;font-size:13px;padding:0 16px;cursor:pointer;flex-shrink:0}
.api-btn:hover{background:#00c49a}
.chat{flex:1;overflow-y:auto;padding:10px;background:#0b141a;background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,.018) 1px,transparent 0);background-size:22px 22px;display:flex;flex-direction:column;gap:2px}
.chat::-webkit-scrollbar{width:4px}
.chat::-webkit-scrollbar-thumb{background:#2a3942;border-radius:2px}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 30px 40px;color:#8696a0;text-align:center;gap:14px;pointer-events:none;user-select:none}
.empty h2{color:#e9edef;font-size:18px;font-weight:600}
.empty p{font-size:13px;line-height:1.7}
.datediv{text-align:center;margin:8px 0 4px;flex-shrink:0}
.datediv span{background:#182229;color:#8696a0;font-size:12px;padding:4px 12px;border-radius:7px;border:1px solid #2a3942}
.sysmsg{text-align:center;margin:4px 0 10px;flex-shrink:0}
.sysmsg span{background:#182229;color:#8696a0;font-size:11.5px;padding:5px 14px;border-radius:7px;border:1px solid #2a3942;display:inline-block;line-height:1.6}
.mrow{display:flex;flex-direction:column;max-width:80%;flex-shrink:0}
.mrow.sent{align-self:flex-end}
.mrow.recv{align-self:flex-start}
.slbl{font-size:12.5px;font-weight:600;margin-bottom:2px;padding-left:3px}
.bub{padding:6px 10px 20px;border-radius:8px;position:relative;word-break:break-word;min-width:70px}
.sent .bub{background:#005c4b;border-radius:8px 0 8px 8px}
.recv .bub{background:#202c33;border-radius:0 8px 8px 8px}
.btxt{font-size:14.5px;line-height:1.45;color:#e9edef}
.bmeta{position:absolute;bottom:4px;right:8px;display:flex;align-items:center;gap:3px}
.btime{font-size:11px;color:#8696a0;white-space:nowrap}
.chk{font-size:12px;color:#53bdeb;letter-spacing:-1px}
.trow{align-self:flex-start;display:flex;flex-direction:column;flex-shrink:0}
.tnm{font-size:12.5px;font-weight:600;margin-bottom:2px;padding-left:3px}
.tbub{background:#202c33;border-radius:0 8px 8px 8px;padding:11px 16px;display:flex;gap:5px;align-items:center}
.dot{width:8px;height:8px;background:#8696a0;border-radius:50%;animation:pulse 1.3s infinite ease-in-out}
.dot:nth-child(1){animation-delay:0s}
.dot:nth-child(2){animation-delay:.22s}
.dot:nth-child(3){animation-delay:.44s}
@keyframes pulse{0%,80%,100%{transform:scale(.65);opacity:.35}40%{transform:scale(1);opacity:1}}
.iarea{background:#202c33;padding:8px 10px;display:flex;align-items:flex-end;gap:8px;flex-shrink:0}
.iwrap{flex:1;background:#2a3942;border-radius:22px;display:flex;align-items:flex-end;padding:7px 14px;gap:8px}
.eico{fill:#8696a0;flex-shrink:0;margin-bottom:1px}
textarea{flex:1;background:transparent;border:none;outline:none;color:#e9edef;font-size:15px;resize:none;max-height:110px;min-height:22px;line-height:1.5;font-family:inherit;overflow-y:auto}
textarea::placeholder{color:#8696a0}
.sbtn{background:#00a884;border:none;border-radius:50%;width:46px;height:46px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s,transform .1s}
.sbtn:hover{background:#00c49a}
.sbtn:active{background:#008f72;transform:scale(.94)}
.sbtn svg{fill:white}
</style>
</head>

<script>
const USERS=[
  {name:"Klaus B.",    color:"#53bdeb"},
  {name:"Brigitte H.", color:"#7bc67e"},
  {name:"Horst M.",    color:"#fcbd2d"},
  {name:"Sabine K.",   color:"#ff8fab"},
  {name:"Dieter W.",   color:"#d3a2f7"}
];
const QUESTIONS=[
  "Seht ihr das auch? Die Wolken h\u00e4ngen heute so tief...",
  "Ist das gerade Schnee oder doch nur gefrierender Regen?",
  "Wird das heute noch ein Gewitter, was meint ihr?",
  "Hat jemand die Sch\u00e4fchenwolken vorhin beobachtet?",
  "Warum liegt da ein einzelner Stein mitten auf dem Gehweg?",
  "Ist das Gras bei euch auch schon so gelb und ausgetrocknet?",
  "Kennt jemand diese seltsame Wolkenformation gerade?",
  "Wann kommt endlich mal wieder die Sonne?",
  "Schneit es gerade nahezu horizontal?",
  "Hat jemand die Mondfinsternis letzte Nacht beobachtet?",
  "Warum ist der Himmel heute Abend so ungew\u00f6hnlich orange?",
  "Ist das Eis auf der Stra\u00dfe bei euch auch noch nicht getaut?",
  "Habt ihr den doppelten Regenbogen vorhin gesehen?!",
  "F\u00e4llt euch auf, dass es dieses Jahr kaum richtig geschneit hat?",
  "Wer wei\u00df wie hoch die Schneeschicht in seinem Garten ist?",
  "Ist das da Hagel oder doch nur sehr starker Regen?",
  "Kann jemand die Windgeschwindigkeit gerade einsch\u00e4tzen?",
  "Warum leuchtet das Gras nach dem Regen immer so intensiv gr\u00fcn?",
  "Hat jemand schon mal einen Eiskristall unter der Lupe fotografiert?",
  "Zieht da bei euch auch gerade ein Gewitter auf?",
  "Ist bei euch der Baum im Sturm auch so gef\u00e4hrlich am Schwanken?",
  "Findet ihr Graupel sch\u00f6ner als richtigen Pulverschnee?",
  "Wie lange dauert dieses Tiefdruckgebiet noch an?",
  "Hat jemand das gro\u00dfe schwarze Tier im Nachbargarten gesehen?",
  "Warum gl\u00e4nzen nasse Steine nach dem Regen so sch\u00f6n?",
  "Sieht der Himmel bei euch auch aus wie ein riesiges Aquarell?",
  "Ist der erste Frost heute Nacht auch bei euch angekommen?",
  "Habt ihr die Stare auf dem Dach heute fr\u00fch schon geh\u00f6rt?",
  "Warum ziehen die Wolken heute so ungew\u00f6hnlich schnell?",
  "Wann wurde das Stra\u00dfenpflaster hier eigentlich zuletzt gewaschen?"
];
const STATEMENTS=[
  "Die Wolken sehen heute aus wie riesige Watteb\u00e4usche. Traumhaft.",
  "Es schneit! Endlich mal wieder richtiger Winter! \u2744\ufe0f",
  "Das Gras ist komplett vereist. Ich gehe heute definitiv nicht raus.",
  "Der Stein dort liegt jetzt seit drei Wochen an derselben Stelle.",
  "Heute Morgen war der Nebel so dicht, ich konnte die Stra\u00dfe nicht sehen.",
  "Die Sonne geht gerade so wundersch\u00f6n unter. Unglaublich.",
  "Es hagelt! Mein neues Auto steht drau\u00dfen!!!",
  "Der Wind pfeift hier so laut durch die Fensterritzen.",
  "Das Eis auf den Pf\u00fctzen sieht aus wie durchsichtiges Glas.",
  "Die Sch\u00e4fchenwolken ziehen heute in perfekten Reihen vorbei.",
  "Erster Schnee! Ich hab mein Kind extra geweckt, damit es das sieht.",
  "Die Birke drau\u00dfen hat jetzt alle Bl\u00e4tter verloren. Herbst ist durch.",
  "Es ist so grau heute. So ein richtiger, echter Novembertag.",
  "Der Regenbogen gerade war doppelt. DOPPELTER REGENBOGEN! \ud83c\udf08",
  "Die Tauben sitzen alle aufgeplustert auf dem Dach. Sturm kommt.",
  "Das Moos auf den alten Steinen leuchtet nach dem Regen so gr\u00fcn.",
  "Der Frost hat heute Nacht Blumenmuster ans Fenster gemalt. So zart!",
  "So ein Sturm! Die M\u00fclltonne liegt quer auf der Stra\u00dfe.",
  "Beim Schneefall h\u00f6re ich immer diese ganz besondere Stille.",
  "Die Kastanien fallen gerade alle gleichzeitig runter.",
  "Die nasse Stra\u00dfe gl\u00e4nzt gerade wie ein perfekter Spiegel.",
  "Heute Morgen lag ein Igel zusammengerollt im Garten. \ud83e\udd94",
  "Die Wolke da oben sieht aus wie ein riesiger Hase. Seht ihr das?!",
  "Gestern Abend war der Mond so gro\u00df, ich dachte er f\u00e4llt runter.",
  "Der erste Schnee liegt auf den \u00c4sten wie Puderzucker.",
  "Minus acht Grad. Tee, Heizung und aus dem Fenster schauen. Perfekt.",
  "Die Amseln singen schon wieder. Der Fr\u00fchling kommt! \ud83d\udc26",
  "Heute war der Himmel in drei verschiedenen Farben. Wahnsinn.",
  "Der Regen trommelt so laut aufs Dach, ich kann kaum schlafen.",
  "Nach dem Schneefall ist es so still. Die Welt h\u00e4lt den Atem an."
];
const ALL=[...QUESTIONS,...STATEMENTS];

let started=false, busy=false;
const chatEl  = document.getElementById("chat");
const msgEl   = document.getElementById("msg");
const sendEl  = document.getElementById("sendBtn");
const stEl    = document.getElementById("apiStatus");
const keyEl   = document.getElementById("apiKeyInput");

let HF_KEY = localStorage.getItem("hf_key") || "";
function refreshStatus(){
  if(HF_KEY){ stEl.textContent="aktiv \u2714"; stEl.className="api-st ok"; keyEl.value=HF_KEY; }
  else { stEl.textContent="kein Key"; stEl.className="api-st no"; }
}
refreshStatus();
document.getElementById("apiSaveBtn").addEventListener("click", function(){
  var v = keyEl.value.trim();
  if(v){ HF_KEY=v; localStorage.setItem("hf_key",v); }
  else { HF_KEY=""; localStorage.removeItem("hf_key"); }
  refreshStatus();
});

function ts(){ return new Date().toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}); }
function rnd(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }
function pick(arr,ex){
  var i; do { i=rnd(0,arr.length-1); } while(i===ex);
  return {item:arr[i], idx:i};
}
function safe(t){
  var d=document.createElement("div");
  d.appendChild(document.createTextNode(t));
  return d.innerHTML;
}
function scrollBot(){ chatEl.scrollTop=chatEl.scrollHeight; }

function initChat(){
  if(started) return; started=true;
  document.getElementById("emptyState").remove();
  var dd=document.createElement("div"); dd.className="datediv";
  dd.innerHTML="<span>Heute</span>"; chatEl.appendChild(dd);
  var sm=document.createElement("div"); sm.className="sysmsg";
  sm.innerHTML="<span>\ud83d\udd12 Ende-zu-Ende-verschl\u00fcsselt</span>"; chatEl.appendChild(sm);
}

function addMsg(text,side,user){
  var row=document.createElement("div"); row.className="mrow "+side;
  if(side==="recv" && user){
    var l=document.createElement("div"); l.className="slbl";
    l.style.color=user.color; l.textContent=user.name; row.appendChild(l);
  }
  var b=document.createElement("div"); b.className="bub";
  b.innerHTML='<div class="btxt">'+safe(text)+'</div>'
    +'<div class="bmeta"><span class="btime">'+ts()+'</span>'
    +(side==="sent"?'<span class="chk">\u2713\u2713</span>':"")
    +'</div>';
  row.appendChild(b); chatEl.appendChild(row); scrollBot();
}

function showTyping(user){
  var row=document.createElement("div"); row.className="trow"; row.id="typingRow";
  var l=document.createElement("div"); l.className="tnm"; l.style.color=user.color; l.textContent=user.name;
  var b=document.createElement("div"); b.className="tbub";
  b.innerHTML='<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
  row.appendChild(l); row.appendChild(b); chatEl.appendChild(row); scrollBot();
}
function hideTyping(){ var e=document.getElementById("typingRow"); if(e) e.remove(); }

const HF_MODEL="mistralai/Mistral-7B-Instruct-v0.3";
const SYS='Du bist Mitglied der WhatsApp-Gruppe "Fenstergucker". Antworte auf Deutsch, kurz und locker (max. 2 S\u00e4tze). Schreib \u00fcber das, was du gerade aus deinem Fenster siehst: Wolken, Schnee, Regen, Nebel, Eis, Steine, Gras, Sturm, Mond oder Sonne.';
async function askHF(msg){
  var prompt="<s>[INST] "+SYS+"\n\nGruppennachricht: "+msg+" [/INST]";
  var r=await fetch("https://api-inference.huggingface.co/models/"+HF_MODEL,{
    method:"POST",
    headers:{"Authorization":"Bearer "+HF_KEY,"Content-Type":"application/json"},
    body:JSON.stringify({inputs:prompt,parameters:{max_new_tokens:80,temperature:0.85,return_full_text:false}})
  });
  if(!r.ok) throw new Error("hf "+r.status);
  var d=await r.json();
  var t=Array.isArray(d)?d[0].generated_text:d.generated_text;
  t=t.replace(/^\s*\[\/INST\]\s*/,"").replace(/^\s*<\/s>\s*/,"").trim();
  var s=t.match(/[^.!?]+[.!?]+/g);
  return s?s.slice(0,2).join(" ").trim():t.split("\n")[0].trim();
}

async function reply(userMsg, user){
  showTyping(user);
  var text;
  try{
    if(!HF_KEY) throw new Error("no key");
    text=await askHF(userMsg);
  } catch(e){
    text=pick(ALL).item;
  }
  hideTyping();
  addMsg(text,"recv",user);
}

async function handleSend(){
  if(busy) return;
  var text=msgEl.value.trim();
  if(!text) return;
  msgEl.value=""; msgEl.style.height="auto";
  initChat();
  addMsg(text,"sent",null);
  busy=true;
  try{
    var delay=rnd(600,1300);
    await new Promise(function(res){setTimeout(res,delay);});
    var u1=pick(USERS).item;
    await reply(text,u1);
    if(Math.random()<0.35){
      await new Promise(function(res){setTimeout(res,rnd(400,900));});
      var u2; do { u2=pick(USERS).item; } while(u2.name===u1.name);
      await reply(text,u2);
    }
  } finally {
    hideTyping();
    busy=false;
  }
}

sendEl.addEventListener("click", handleSend);
msgEl.addEventListener("keydown", function(e){
  if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); handleSend(); }
});
msgEl.addEventListener("input", function(){
  this.style.height="auto";
  this.style.height=Math.min(this.scrollHeight,110)+"px";
});
</script>
